<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Task Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-900 text-slate-100 flex items-center justify-center px-4">
    
    <div class="max-w-md w-full text-center space-y-6">
        <!-- Icon / Graphic -->
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-slate-800 text-indigo-400 text-5xl shadow-inner mb-2 animate-bounce">
            <i class="fa-solid fa-compass-drafting"></i>
        </div>

        <!-- Error Code -->
        <h1 class="text-7xl font-extrabold tracking-widest text-indigo-500">404</h1>
        
        <!-- Messages -->
        <div class="space-y-2">
            <h2 class="text-2xl font-bold tracking-tight text-white">Page not found</h2>
            <p class="text-slate-400 text-sm">
                Sorry, the page you are looking for doesn't exist, has been removed, or is temporarily unavailable.
            </p>
        </div>

        <!-- Action Button -->
        <div class="pt-4">
            <a href="index.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-500 transition-all shadow-lg shadow-indigo-600/30 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                <i class="fa-solid fa-house"></i>
                Back to Dashboard
            </a>
        </div>

        <!-- Footer Note -->
        <p class="text-xs text-slate-500 pt-6">
            Powered by Nginx & Task Management App
        </p>
    </div>

</body>
</html>
